name: Auditor IA

on:
  push:
    branches:
      - main
      - auditor-ia
  pull_request:
    branches:
      - main

jobs:
  auditor-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sistema
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f documentacao/requirements.txt ]; then pip install -r documentacao/requirements.txt; fi
          if [ -f requirements-optional.txt ]; then pip install -r requirements-optional.txt || true; fi
          if [ -f documentacao/requirements-optional.txt ]; then pip install -r documentacao/requirements-optional.txt || true; fi

      - name: Compile Python files
        run: python -m ururau_ai_auditor.run_auditoria

      - name: Contract tests
        run: python -m unittest discover -s tests_contrato -p "test_*.py" -v
